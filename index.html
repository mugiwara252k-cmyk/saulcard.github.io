<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>design card</title>
</head>
<style>
    .parent {
        border: 3px solid black;
        height: 65vw;
        width: 50vw;
        border-radius: 32px;
        background-color: rgb(255, 221, 0);

    }

    .box {
        height: 24vw;
        width: 44vw;
        margin-top: 10px;
        /* border: 2px solid black; */
        border-radius: 32px;
        overflow: hidden;
    }

    .text {
        margin-top: 10px;
        font-family: 'Times New Roman', Times, serif;
        font-size: larger;
    }

    .png {
        height: min-content;
    }
</style>

<body background="saul.jpg">
    <center>
        <div class="parent">
            <div class="box"><img src="saul-goodman-meme.jpg" alt=""></div>
            <div class="png"><img src="better call saul logo.png" alt=""></div>
            <div class="text">Hi, I'm Saul Goodman. Did you know that you have rights? The Constitution says you do. And
                so do I. I believe that until proven guilty, every man, woman, and child in this country is innocent.
                And that's why I fight for you, Albuquerque! Better call Saul! </div>
        </div>
        <div><audio controls autoplay loop src="better-call-saul-intro.mp3"></audio></div>

    </center>
</body>

</html>
